{{ $gaID := getenv "GA_TRACKING_ID" }}
{{ if and (eq hugo.Environment "production") $gaID }}
{{ $gaScript := partialCached "analytics/ga-resource.html" $gaID $gaID }}
<script>
  let gaLoaded = false;
  function hasGAConsent() {
    if (typeof window.cleverAnalyticsConsent === 'boolean') return window.cleverAnalyticsConsent;
    try { return localStorage.getItem('analytics_consent') === 'true'; }
    catch { return false; }
  }
  function loadGA() {
    if (gaLoaded || !hasGAConsent()) return;
    gaLoaded = true;
    const script = document.createElement('script');
    script.src = '{{ $gaScript.RelPermalink }}';
    script.integrity = '{{ $gaScript.Data.Integrity }}';
    script.crossOrigin = 'anonymous';
    script.async = true;
    document.head.appendChild(script);

    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ $gaID }}');
  }

  function scheduleGA() {
    if (!hasGAConsent() || gaLoaded) return;
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadGA, { timeout: 5000 });
    } else {
      setTimeout(loadGA, 3000);
    }
  }
  window.addEventListener('analytics-consent', scheduleGA);
  scheduleGA();
</script>
{{ end }}
